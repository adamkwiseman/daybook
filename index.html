<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Planning Daybook</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f7f5;
      color: #333;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    header h1 {
      font-size: 24px;
      font-weight: 500;
      color: #222;
    }
    
    .nav-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    button {
      padding: 8px 16px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #f5f5f5;
      border-color: #999;
    }
    
    button.active {
      background: #2c5aa0;
      color: #fff;
      border-color: #2c5aa0;
    }
    
    .date-display {
      font-size: 14px;
      color: #666;
      min-width: 150px;
      text-align: center;
    }
    
    /* ===== WEEKLY VIEW ===== */
    .weekly-view {
      background: #fff;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .week-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    
    .day-card {
      background: #fafaf8;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }
    
    .day-card:hover {
      background: #f0ece8;
      border-color: #999;
    }
    
    .day-card.holiday {
      background: #f5e6e6;
      opacity: 0.7;
      cursor: not-allowed;
    }
    
    .day-card.selected {
      background: #e8f1f8;
      border-color: #2c5aa0;
      border-width: 2px;
    }
    
    .day-card.today:not(.selected) {
      border: 2px dashed #999;
    }
    
    .day-header {
      font-weight: 600;
      font-size: 16px;
      color: #222;
      margin-bottom: 4px;
    }
    
    .day-meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .day-cycle {
      font-size: 13px;
      font-weight: 500;
      color: #2c5aa0;
      margin-bottom: 8px;
    }
    
    .isp-label {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 2px;
      display: inline-block;
      margin-top: 4px;
    }
    
    .isp-label.group-a {
      background: #fce4ec;
      color: #c2185b;
    }
    
    .isp-label.group-b {
      background: #e3f2fd;
      color: #1565c0;
    }
    
    .holiday-label {
      font-size: 11px;
      padding: 2px 6px;
      background: #ffcccc;
      color: #c00;
      border-radius: 2px;
      display: inline-block;
    }
    
    .ca-label {
      font-size: 11px;
      padding: 2px 6px;
      background: #fff3cd;
      color: #856404;
      border-radius: 2px;
      display: inline-block;
      margin-bottom: 6px;
    }
    
    /* ===== DAILY VIEW ===== */
    .daily-view {
      background: #fff;
      border-radius: 4px;
      padding: 20px;
      display: none;
    }
    
    .daily-view.active {
      display: block;
    }
    
    .daily-header {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 20px;
      color: #222;
      padding-bottom: 12px;
      border-bottom: 2px solid #2c5aa0;
    }
    
    .period-block {
      margin-bottom: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    
    .period-header {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: #333;
      user-select: none;
      border-left: 4px solid transparent;
    }
    
    .period-header:hover {
      opacity: 0.9;
    }
    
    .period-header.duty {
      background: #f5f5f5;
    }
    
    .period-header.break {
      background: #f5f5f5;
    }
    
    .period-header.isp-literacy {
      background: #e8d5f0;
      border-left-color: #b565a7;
    }
    
    .period-header.isp-math {
      background: #d1e4f7;
      border-left-color: #5b8cc8;
    }
    
    .period-header.subject-green {
      background: #d4f1d4;
      border-left-color: #4caf50;
    }
    
    .period-header.regular {
      background: #fff3e0;
      border-left-color: #ffb74d;
    }
    
    /* Expanded state now darkens the existing pastel instead of
       overwriting it with a flat blue, so color-coding survives */
    .period-block.expanded .period-header {
      filter: brightness(0.93);
    }
    
    .period-block.expanded {
      box-shadow: 0 0 0 2px #2c5aa0;
    }
    
    .period-time {
      font-size: 13px;
      color: #666;
      font-weight: normal;
    }
    
    .period-content {
      padding: 16px;
      display: none;
    }
    
    .period-content.active {
      display: block;
      background: #fafaf8;
    }
    
    .field-group {
      margin-bottom: 16px;
    }
    
    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    
    textarea, input[type="text"], input[type="url"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      min-height: 50px;
    }
    
    textarea:focus, input:focus {
      outline: none;
      border-color: #2c5aa0;
      background: #f9fafb;
    }
    
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .tab-btn {
      padding: 8px 12px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 2px solid transparent;
      color: #666;
      transition: all 0.2s;
    }
    
    .tab-btn.active {
      color: #2c5aa0;
      border-bottom-color: #2c5aa0;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }
    
    .btn-primary {
      background: #2c5aa0;
      color: #fff;
      border-color: #2c5aa0;
    }
    
    .btn-primary:hover {
      background: #1e4070;
    }
    
    .isp-info {
      background: #fffbf0;
      padding: 8px 12px;
      border-left: 3px solid #ff9800;
      border-radius: 2px;
      font-size: 12px;
      margin-bottom: 12px;
      color: #666;
    }
    
    .no-data {
      color: #999;
      font-style: italic;
      font-size: 13px;
    }
    
    @media (max-width: 768px) {
      .week-grid {
        grid-template-columns: 1fr;
      }
      
      header {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Teacher Planning Daybook</h1>
      <div class="nav-controls">
        <button onclick="prevWeek()">← Previous</button>
        <div class="date-display" id="dateDisplay"></div>
        <button onclick="nextWeek()">Next →</button>
        <button onclick="goToday()">Today</button>
        <button onclick="setupSync()" id="syncBtn" title="Set up cross-device sync">🔄 <span id="syncStatus">Not synced</span></button>
      </div>
    </header>
    
    <!-- WEEKLY VIEW -->
    <div class="weekly-view" id="weeklyView">
      <h2 style="font-size: 16px; margin-bottom: 12px; color: #333;">Week of <span id="weekLabel"></span></h2>
      <div class="week-grid" id="weekGrid"></div>
    </div>
    
    <!-- DAILY VIEW -->
    <div class="daily-view active" id="dailyView">
      <div class="daily-header" id="dailyHeader"></div>
      <div style="background: #fffacd; border: 1px solid #f0e68c; border-radius: 4px; padding: 12px; margin-bottom: 20px;">
        <textarea id="dailyNotes" placeholder="Type a note..." style="width: 100%; min-height: 80px; border: none; background: transparent; resize: vertical; font-size: 14px; padding: 0;" onchange="saveDailyNotes()"></textarea>
      </div>
      <div id="periodsContainer"></div>
      <div class="controls">
        <button class="btn-primary" onclick="exportPDF()">📥 Export as PDF</button>
        <button onclick="backToWeek()">← Back to Week</button>
      </div>
    </div>
  </div>

  <script>
    // Constants
    const FIRST_DAY = new Date(2026, 8, 8); // Sept 8, 2026 = actual first day of school = Day 1
    const PERIODS = [
      { num: 'Duty', time: '8:45 - 9:00', type: 'duty', color: '#f5f5f5' },
      { num: 1, time: '9:00 - 9:30', type: 'period', color: '#fff3e0' },
      { num: 2, time: '9:30 - 10:00', type: 'period', color: '#fff3e0' },
      { num: 3, time: '10:00 - 10:30', type: 'period', color: '#fff3e0' },
      { num: 4, time: '10:30 - 11:00', type: 'period', color: '#fff3e0' },
      { num: 'Break', time: '11:00 - 11:40', type: 'break', color: '#f5f5f5' },
      { num: 5, time: '11:40 - 12:10', type: 'period', color: '#f3e5f5' },
      { num: 6, time: '12:10 - 12:40', type: 'period', color: '#e8f5e9' },
      { num: 7, time: '12:40 - 1:10', type: 'period', color: '#fff3e0' },
      { num: 8, time: '1:10 - 1:40', type: 'period', color: '#f3e5f5' },
      { num: 'Break', time: '1:40 - 2:20', type: 'break', color: '#f5f5f5' },
      { num: 9, time: '2:20 - 2:50', type: 'period', color: '#e3f2fd' },
      { num: 10, time: '2:50 - 3:20', type: 'period', color: '#e3f2fd' }
    ];
    
    // Actual school closures only — Statutory Holidays + PD Days + breaks.
    // The cycle skips these days entirely.
    const HOLIDAYS = [
      '2026-09-07', // Labour Day
      '2026-09-02', '2026-09-03', // PD Days
      '2026-10-12', // Thanksgiving
      '2026-10-26', // PD Day
      '2026-12-21', '2026-12-22', '2026-12-23', '2026-12-24', '2026-12-25', '2026-12-26', '2026-12-27', '2026-12-28', '2026-12-29', '2026-12-30', '2026-12-31', // Winter Break
      '2027-01-01', // Winter Break
      '2027-01-15', // PD Day
      '2027-02-15', // Family Day
      '2027-03-15', '2027-03-16', '2027-03-17', '2027-03-18', '2027-03-19', // March Break
      '2027-03-26', // Good Friday
      '2027-03-29', // Easter Monday
      '2027-04-23', // PD Day
      '2027-05-24', // Victoria Day
      '2027-05-31', // PD Day
      '2027-06-30' // PD Day
    ];
    
    // Creed Accommodation days — school stays OPEN, the cycle keeps going,
    // these just get a small badge on the day card.
    const CA_DAYS = {
      '2026-09-12': 'Rosh Hashanah', '2026-09-13': 'Rosh Hashanah',
      '2026-09-21': 'Yom Kippur',
      '2026-09-30': 'Truth & Reconciliation',
      '2026-10-16': 'Sukkot', '2026-10-17': 'Sukkot',
      '2026-11-08': 'Diwali / Bandi Chhor Divas', '2026-11-09': 'Mahavira Nirvana',
      '2027-01-07': 'Orthodox Christmas',
      '2027-02-06': 'Lunar New Year',
      '2027-03-10': 'Eid-al-Fitr',
      '2027-04-14': 'Vaisakhi',
      '2027-04-21': 'Passover', '2027-04-22': 'Passover',
      '2027-04-30': 'Orthodox Good Friday',
      '2027-05-16': 'Eid Al Adha',
      '2027-05-20': 'Wesak',
      '2027-06-21': "Indigenous Peoples' Day"
    };
    
    function getCADayName(dateStr) {
      return CA_DAYS[dateStr] || null;
    }
    
    const ISP_ROTATION = {
      1: { periods: [1,2,3,4], group: 'A' },
      2: { periods: [1,2,3,4], group: 'B' },
      3: { periods: [1,2,3,4], group: 'A' },
      4: { periods: [1,2,3,4], group: 'B' },
      5: { periods: [1,2,3,4], group: 'A' }
    };
    
    let currentDate = new Date();
    let selectedDate = null;
    let planData = {};
    
    // Utility functions
    function dateToString(d) {
      // Use local date components — toISOString() converts to UTC and can
      // roll over to the wrong calendar day near midnight in local time.
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    
    function stringToDate(s) {
      return new Date(s + 'T00:00:00');
    }
    
    function isHoliday(date) {
      return HOLIDAYS.includes(dateToString(date));
    }
    
    function isWeekend(date) {
      return date.getDay() === 0 || date.getDay() === 6;
    }
    
    function isSchoolDay(date) {
      return !isWeekend(date) && !isHoliday(date);
    }
    
    // Strips the time-of-day component so date comparisons are never
    // thrown off by leftover hours/minutes (e.g. from `new Date()`).
    function midnight(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }
    
    // Counts only actual school days (skips weekends AND holidays/PA days)
    // between FIRST_DAY and the target date, so the 5-day cycle stays in
    // sync with reality no matter how many non-school days fall in between.
    function getDayOfCycle(date) {
      const target = midnight(date);
      if (!isSchoolDay(target)) return null;
      let count = 0;
      const d = midnight(FIRST_DAY);
      while (d < target) {
        if (isSchoolDay(d)) count++;
        d.setDate(d.getDate() + 1);
      }
      return (count % 5) + 1;
    }
    
    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }
    
    function getISPGroup(date) {
      const dayNum = getDayOfCycle(date);
      if (!dayNum) return '-';
      return ISP_ROTATION[dayNum]?.group || '-';
    }
    
    function loadPlanData() {
      const saved = localStorage.getItem('teacherDaybook');
      if (saved) planData = JSON.parse(saved);
    }
    
    function savePlanData() {
      localStorage.setItem('teacherDaybook', JSON.stringify(planData));
      pushToCloud();
    }
    
    // ===== CROSS-DEVICE SYNC (Firebase Firestore) =====
    // PASTE YOUR firebaseConfig FROM THE FIREBASE CONSOLE HERE:
    const firebaseConfig = {
      apiKey: "AIzaSyAlvTecXVHkoR7CZBMZ7rBwP47bN8ynkK0",
      authDomain: "daybook-3c39c.firebaseapp.com",
      projectId: "daybook-3c39c",
      storageBucket: "daybook-3c39c.firebasestorage.app",
      messagingSenderId: "673483245849",
      appId: "1:673483245849:web:9101a11007bc527501dd88"
    };
    
    const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== 'YOUR_API_KEY';
    let syncCode = localStorage.getItem('daybookSyncCode') || '';
    let db = null;
    let unsubscribeListener = null;
    let applyingRemoteUpdate = false; // guards against feedback loops
    
    if (FIREBASE_CONFIGURED) {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
      } catch (e) {
        console.error('Firebase init failed', e);
      }
    }
    
    function updateSyncStatusUI(text) {
      const el = document.getElementById('syncStatus');
      if (el) el.textContent = text;
    }
    
    function setupSync() {
      if (!FIREBASE_CONFIGURED) {
        alert('Sync isn\'t configured in this file yet. Paste your firebaseConfig into the script (see the comment marked "PASTE YOUR firebaseConfig HERE") and re-upload the file.');
        return;
      }
      const entered = prompt(
        'Enter a long, unique sync code (12+ characters).\nUse this exact same code on every device you want synced:',
        syncCode || ''
      );
      if (entered === null) return; // cancelled
      const trimmed = entered.trim();
      if (trimmed.length < 12) {
        alert('Sync code must be at least 12 characters for security. Try something like a memorable passphrase.');
        return;
      }
      syncCode = trimmed;
      localStorage.setItem('daybookSyncCode', syncCode);
      attachSyncListener();
    }
    
    function attachSyncListener() {
      if (!db || !syncCode) {
        updateSyncStatusUI('Not synced');
        return;
      }
      if (unsubscribeListener) unsubscribeListener();
      updateSyncStatusUI('Connecting…');
      const ref = db.collection('daybooks').doc(syncCode);
      unsubscribeListener = ref.onSnapshot(
        (doc) => {
          updateSyncStatusUI('Synced');
          if (doc.exists) {
            const remote = doc.data();
            const remoteData = remote && remote.data ? JSON.parse(remote.data) : {};
            applyingRemoteUpdate = true;
            planData = remoteData;
            localStorage.setItem('teacherDaybook', JSON.stringify(planData));
            if (selectedDate) selectDay(selectedDate); else renderWeek();
            applyingRemoteUpdate = false;
          } else {
            // First time this sync code is used — seed the cloud with local data
            pushToCloud();
          }
        },
        (err) => {
          console.error('Sync listen failed', err);
          updateSyncStatusUI('Sync error');
        }
      );
    }
    
    function pushToCloud() {
      if (!db || !syncCode || applyingRemoteUpdate) return;
      db.collection('daybooks').doc(syncCode).set({
        data: JSON.stringify(planData),
        updatedAt: Date.now()
      }).catch((err) => {
        console.error('Sync save failed', err);
        updateSyncStatusUI('Sync error');
      });
    }
    
    function getPlanEntry(dateStr, period) {
      if (!planData[dateStr]) planData[dateStr] = { dailyNotes: '' };
      if (!planData[dateStr][period]) {
        planData[dateStr][period] = {
          objective: '',
          activities: '',
          resources: '',
          prepNotes: '',
          reflection: '',
          progress: '',
          assessment: ''
        };
      }
      return planData[dateStr][period];
    }
    
    function saveDailyNotes() {
      if (!selectedDate) return;
      if (!planData[selectedDate]) planData[selectedDate] = {};
      planData[selectedDate].dailyNotes = document.getElementById('dailyNotes').value;
      savePlanData();
    }
    
    // Render functions
    function renderWeek() {
      const monday = getMonday(currentDate);
      const weekLabel = `${monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${new Date(monday.getTime() + 4*24*60*60*1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
      document.getElementById('weekLabel').textContent = weekLabel;
      document.getElementById('dateDisplay').textContent = weekLabel;
      
      const grid = document.getElementById('weekGrid');
      grid.innerHTML = '';
      
      const dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
      for (let i = 0; i < 5; i++) {
        const date = new Date(monday.getTime() + i*24*60*60*1000);
        const dateStr = dateToString(date);
        const dayNum = getDayOfCycle(date);
        const isHol = isHoliday(date);
        const isSel = selectedDate && dateStr === selectedDate;
        const isToday = dateStr === dateToString(new Date());
        
        const card = document.createElement('div');
        card.className = `day-card ${isHol ? 'holiday' : ''} ${isSel ? 'selected' : ''} ${isToday ? 'today' : ''}`;
        if (!isHol) card.onclick = () => selectDay(dateStr);
        
        let holidayText = '';
        if (isHol) {
          const holName = getHolidayName(dateStr);
          holidayText = `<div class="holiday-label">${holName}</div>`;
        }
        
        const ispGroup = getISPGroup(date);
        const caName = getCADayName(dateStr);
        const caText = (!isHol && caName) ? `<div class="ca-label">${caName}</div>` : '';
        
        card.innerHTML = `
          <div class="day-header">${dayNames[i]}</div>
          <div class="day-meta">${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
          ${holidayText}
          ${caText}
          ${!isHol ? `<div class="day-cycle">Day ${dayNum}</div><div class="isp-label isp-label-${ispGroup.toLowerCase()}">ISP: Group ${ispGroup}</div>` : ''}
        `;
        grid.appendChild(card);
      }
    }
    
    function getHolidayName(dateStr) {
      const holMap = {
        '2026-09-07': 'Labour Day',
        '2026-09-02': 'PD Day',
        '2026-09-03': 'PD Day',
        '2026-10-12': 'Thanksgiving',
        '2026-10-26': 'PD Day',
        '2027-02-15': 'Family Day',
        '2027-03-26': 'Good Friday',
        '2027-03-29': 'Easter Monday',
        '2027-05-24': 'Victoria Day',
        '2027-05-31': 'PD Day',
        '2027-06-30': 'PD Day'
      };
      if (holMap[dateStr]) return holMap[dateStr];
      if (dateStr >= '2026-12-21' && dateStr <= '2027-01-01') return 'Winter Break';
      if (dateStr >= '2027-03-15' && dateStr <= '2027-03-19') return 'March Break';
      return 'Holiday';
    }
    
    function selectDay(dateStr) {
      selectedDate = dateStr;
      const date = stringToDate(dateStr);
      const dayNum = getDayOfCycle(date);
      const dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
      const dayName = dayNames[date.getDay() - 1];
      
      document.getElementById('dailyHeader').textContent = `${dayName}, ${date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })} — Day ${dayNum}`;
      
      // Load daily notes
      const dayData = planData[dateStr] || {};
      document.getElementById('dailyNotes').value = dayData.dailyNotes || '';
      
      const ispGroup = getISPGroup(date);
      
      const container = document.getElementById('periodsContainer');
      container.innerHTML = '';
      
      if (ispGroup !== '-') {
        const info = document.createElement('div');
        info.className = 'isp-info';
        info.innerHTML = `<strong>ISP Rotation:</strong> Group ${ispGroup} (Periods 1-4 Primary)`;
        container.appendChild(info);
      }
      
      for (const period of PERIODS) {
        const isDutyOrBreak = period.type === 'duty' || period.type === 'break';
        const entry = isDutyOrBreak ? null : getPlanEntry(dateStr, period.num);
        
        const block = document.createElement('div');
        block.className = 'period-block';
        
        let periodLabel = '';
        let headerClass = period.type;
        
        if (period.type === 'duty') {
          periodLabel = 'Back Tarmac Duty';
        } else if (period.type === 'break') {
          periodLabel = 'Nutrition Break';
        } else {
          periodLabel = `Period ${period.num}`;
          // Determine ISP block type based on period number
          if ([5, 8].includes(period.num)) {
            headerClass = 'isp-literacy';
          } else if ([9, 10].includes(period.num)) {
            headerClass = 'isp-math';
          } else if ([6].includes(period.num)) {
            headerClass = 'subject-green';
          } else {
            headerClass = 'regular';
          }
        }
        
        if (isDutyOrBreak) {
          block.innerHTML = `
            <div class="period-header ${headerClass}">
              <span>${periodLabel}</span>
              <span class="period-time">${period.time}</span>
            </div>
          `;
        } else {
          block.innerHTML = `
            <div class="period-header ${headerClass}" onclick="togglePeriod(this)">
              <span>${periodLabel}</span>
              <span class="period-time">${period.time}</span>
              <span class="arrow" style="margin-left: auto;">▼</span>
            </div>
            <div class="period-content">
              <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(this, 'plan')">Plan</button>
                <button class="tab-btn" onclick="switchTab(this, 'prep')">Prep</button>
                <button class="tab-btn" onclick="switchTab(this, 'reflect')">Reflect</button>
              </div>
              
              <div class="tab-content active" data-tab="plan">
                <div class="field-group">
                  <div class="field-label">Objective</div>
                  <textarea placeholder="Learning objective..." onchange="savePeriodData('${dateStr}', ${period.num}, 'objective', this.value)">${entry.objective}</textarea>
                </div>
                <div class="field-group">
                  <div class="field-label">Activities</div>
                  <textarea placeholder="What will students do?..." onchange="savePeriodData('${dateStr}', ${period.num}, 'activities', this.value)">${entry.activities}</textarea>
                </div>
                <div class="field-group">
                  <div class="field-label">Resources & Links</div>
                  <textarea placeholder="Links to resources, documents, etc...." onchange="savePeriodData('${dateStr}', ${period.num}, 'resources', this.value)">${entry.resources}</textarea>
                </div>
              </div>
              
              <div class="tab-content" data-tab="prep">
                <div class="field-group">
                  <div class="field-label">Prep Notes</div>
                  <textarea placeholder="Materials to gather, copies needed, setup notes..." onchange="savePeriodData('${dateStr}', ${period.num}, 'prepNotes', this.value)">${entry.prepNotes}</textarea>
                </div>
              </div>
              
              <div class="tab-content" data-tab="reflect">
                <div class="field-group">
                  <div class="field-label">Reflection</div>
                  <textarea placeholder="What worked? What to adjust? Student responses?" onchange="savePeriodData('${dateStr}', ${period.num}, 'reflection', this.value)">${entry.reflection}</textarea>
                </div>
              </div>
            </div>
          `;
        }
        
        container.appendChild(block);
      }
      
      renderWeek();
    }
    
    function togglePeriod(el) {
      const content = el.nextElementSibling;
      const block = el.parentElement;
      const isOpen = content.classList.toggle('active');
      block.classList.toggle('expanded', isOpen);
      const arrow = el.querySelector('.arrow');
      if (arrow) arrow.textContent = isOpen ? '▲' : '▼';
    }
    
    function switchTab(btn, tab) {
      const container = btn.parentElement.parentElement;
      container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      container.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      container.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    }
    
    function savePeriodData(dateStr, period, field, value) {
      getPlanEntry(dateStr, period)[field] = value;
      savePlanData();
    }
    
    function exportPDF() {
      if (!selectedDate) {
        alert('Select a day first');
        return;
      }
      
      const header = document.getElementById('dailyHeader').textContent;
      const periods = document.querySelectorAll('.period-block');
      
      let html = `<h1>${header}</h1>`;
      
      periods.forEach((block, idx) => {
        const period = PERIODS[idx];
        const headerEl = block.querySelector('.period-header');
        const content = block.querySelector('.period-content');
        
        const isDutyOrBreak = period.type === 'duty' || period.type === 'break';
        
        let periodLabel = '';
        if (isDutyOrBreak) {
          periodLabel = period.type === 'duty' ? 'Back Tarmac Duty' : 'Nutrition Break';
        } else {
          periodLabel = `Period ${period.num}`;
        }
        
        html += `<h2>${periodLabel} (${period.time})</h2>`;
        
        if (!isDutyOrBreak) {
          const plan = content.querySelectorAll('[data-tab="plan"] textarea');
          if (plan[0].value) html += `<p><strong>Objective:</strong> ${plan[0].value}</p>`;
          if (plan[1].value) html += `<p><strong>Activities:</strong> ${plan[1].value}</p>`;
          if (plan[2].value) html += `<p><strong>Resources:</strong> ${plan[2].value}</p>`;
          
          const prep = content.querySelector('[data-tab="prep"] textarea').value;
          if (prep) html += `<p><strong>Prep Notes:</strong> ${prep}</p>`;
        }
        
        html += '<hr>';
      });
      
      const element = document.createElement('div');
      element.innerHTML = html;
      // html2canvas can only capture elements that are actually in the DOM,
      // so attach it off-screen (invisible to the user) before rendering,
      // then remove it once the PDF has been generated.
      // html2canvas has a well-known bug where `position: fixed` elements
      // often capture blank. `absolute` (positioned relative to the normal
      // document flow) is the reliable pattern for off-screen rendering.
      element.style.position = 'absolute';
      element.style.top = '0';
      element.style.left = '-9999px';
      element.style.width = '190mm';
      element.style.background = '#ffffff';
      element.style.padding = '10px';
      document.body.appendChild(element);
      
      const opt = {
        margin: 10,
        filename: `lesson-plan-${selectedDate}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
      };
      
      html2pdf().set(opt).from(element).save()
        .catch((err) => {
          console.error('PDF export failed', err);
          alert('PDF export failed — please try again.');
        })
        .finally(() => {
          document.body.removeChild(element);
        });
    }
    
    function backToWeek() {
      selectedDate = null;
      renderWeek();
    }
    
    function prevWeek() {
      currentDate.setDate(currentDate.getDate() - 7);
      selectedDate = null;
      renderWeek();
    }
    
    function nextWeek() {
      currentDate.setDate(currentDate.getDate() + 7);
      selectedDate = null;
      renderWeek();
    }
    
    function goToday() {
      currentDate = new Date();
      selectedDate = null;
      renderWeek();
    }
    
    // Initialize
    loadPlanData();
    selectDay(dateToString(new Date()));
    if (FIREBASE_CONFIGURED && syncCode) attachSyncListener();
  </script>
</body>
</html>
